<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elemanları Gruplayarak Seçme</title>
  <style>
    h1, h2, p { text-align: center; color: blue; }
  </style>
</head>
<body>
  <h1>h1 Büyük Başlık</h1>
  <h2>h2 Daha Küçük Başlık</h2>
  <p>p Paragrafı. Tüm bu elemanlar tek bir stil tanımlaması ile oluşturuldu.</p>

  <h5>Burası h5 başlığıdır. Stil içerisine konulmadı. Fakat bu yazı büyüklüğünü kendisinde zaten olan h5 özelliğinden almaktadır. Yani h1, h2 ye göre daha küçük başlık anlamındadır.</h5>
</body>
</html>
