<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kenarlık Rengi (border-color)</title>
  <style>
    p { border-style: solid; }
    p.one { border-color: red; }
    p.two { border-color: #ff0000; }
    p.three { border-color: rgb(255, 0, 0); }
    p.four { border-color: hsl(0, 100%, 50%); }
    p.five { border-color: red green blue yellow; }
  </style>
</head>
<body>
  <h2>border-color Özelliği</h2>
  <p class="one">border-color: red;</p>
  <p class="two">border-color: #ff0000;</p>
  <p class="three">border-color: rgb(255, 0, 0);</p>
  <p class="four">border-color: hsl(0, 100%, 50%);</p>
  <p class="five">border-color: red green blue yellow;</p>
</body>
</html>
