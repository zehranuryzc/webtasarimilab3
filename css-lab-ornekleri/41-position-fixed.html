<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>position: fixed;</title>
  <style>
    div.fixed {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 300px;
      border: 3px solid #73AD21;
    }
  </style>
</head>
<body>
  <h2>position: fixed;</h2>
  <p>Bir elemanın fixed ile pozisyonlanması görüntü çerçevesi içerisinde öğe sabit bir şekilde görüntülenir. Yani sayfa kaydırılsa bile öğe hep aynı yerde durur.</p>
  <div class="fixed">Bu öğe, fixed; ile konumlandırılmıştır.</div>
  <div style="height:1500px"></div>
</body>
</html>
