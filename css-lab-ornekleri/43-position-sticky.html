<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>position: sticky;</title>
  <style>
    div.sticky {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      padding: 5px;
      background-color: #cae8ca;
      border: 2px solid #4CAF50;
    }
  </style>
</head>
<body>
  <p>Bu sayfayı kaydırmaya başladığınızda yapışkan div üst kısımda sabitlenir.</p>

  <div class="sticky">Burası yapışkan div in olduğu kısımdır.</div>

  <div style="padding-bottom:2000px">
    <p>sayfayı Doldurma metni</p>
    <p>sayfayı Doldurma metni</p>
    <p>sayfayı Doldurma metni</p>
    <p>sayfayı Doldurma metni</p>
  </div>
</body>
</html>
