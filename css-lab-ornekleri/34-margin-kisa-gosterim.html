<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin Kısa Gösterim</title>
  <style>
    div { border: 1px solid black; background-color: lightblue; margin-bottom: 20px; }
    .d4 { margin: 0px 50px 100px 150px; }
    .d3 { margin: 0px 150px 100px; }
    .d2 { margin: 100px 150px; }
    .d1 { margin: 25px; }
  </style>
</head>
<body>
  <h2>Margin Kısa Gösterim</h2>
  <div class="d4">margin: 0px 50px 100px 150px; (üst, sağ, alt, sol)</div>
  <div class="d3">margin: 0px 150px 100px; (üst, sağ=sol, alt)</div>
  <div class="d2">margin: 100px 150px; (üst=alt, sağ=sol)</div>
  <div class="d1">margin: 25px; (4 yön aynı)</div>
</body>
</html>
