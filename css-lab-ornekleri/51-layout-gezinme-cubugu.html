<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Başlık ve Gezinme Çubuğu (Navigation Bar)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }

    /* Başlığın stili */
    .header {
      background-color: #f1f1f1;
      padding: 20px;
      text-align: center;
    }

    /* Gezinti çubuğunun stili */
    .topnav {
      overflow: hidden;
      background-color: #333;
    }

    /* Gezinti çubuğundaki linklerin stili */
    .topnav a {
      float: left;
      display: block;
      color: #f2f2f2;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    /* Linkin üzerine gelince alacağı stil */
    .topnav a:hover {
      background-color: #ddd;
      color: black;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Header</h1>
  </div>

  <div class="topnav">
    <a href="#">Link1</a>
    <a href="#">Link2</a>
    <a href="#">Link3</a>
  </div>
</body>
</html>
