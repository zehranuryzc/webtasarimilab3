<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gezinti Çubuğu İçinde Açılır Menü</title>
  <style>
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #333;
    }

    li { float: left; }

    li a, .AnaLink {
      display: inline-block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    li a:hover, .AcilirMenu:hover .AnaLink { background-color: red; }

    li.AcilirMenu { display: inline-block; }

    .AcilirMenu_Icerik {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .AcilirMenu_Icerik a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .AcilirMenu_Icerik a:hover { background-color: #f1f1f1; }

    .AcilirMenu:hover .AcilirMenu_Icerik { display: block; }
  </style>
</head>
<body>
  <h3>Gezinti Çubuğu İçinde Açılır Menü Yapımı</h3>

  <ul>
    <li class="AcilirMenu">
      <a href="javascript:void(0)" class="AnaLink">Ana Link1</a>
      <div class="AcilirMenu_Icerik">
        <a href="#">Alt Link 1</a>
        <a href="#">Alt Link 2</a>
        <a href="#">Alt Link 3</a>
      </div>
    </li>

    <li><a href="#">Ana Link2</a></li>
    <li><a href="#">Ana Link3</a></li>
  </ul>
</body>
</html>
