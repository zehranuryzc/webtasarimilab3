<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Border Radius ve Kısa Gösterim</title>
  <style>
    p.yuvarlak { border: 2px solid red; border-radius: 5px; }
    p.kisa { border: 5px solid red; }
    p.alt { border-bottom: 6px solid red; background-color: lightgrey; }
  </style>
</head>
<body>
  <h2>border-radius</h2>
  <p class="yuvarlak">border: 2px solid red; border-radius: 5px;</p>

  <h2>Border kısa gösterimi</h2>
  <p class="kisa">border: 5px solid red;</p>
  <p class="alt">border-bottom: 6px solid red; background-color: lightgrey;</p>
</body>
</html>
