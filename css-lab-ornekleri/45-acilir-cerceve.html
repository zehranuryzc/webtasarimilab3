<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Açılır Çerçeve Yapımı</title>
  <style>
    .AcilirMenu {
      position: relative;
      display: inline-block;
    }

    .SabitMenu {
      color: #000099;
      font-weight: 900;
    }

    .AcilirMenu-Icerik {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      padding: 12px 16px;
      z-index: 1;
    }

    .AcilirMenu:hover .AcilirMenu-Icerik {
      display: block;
    }
  </style>
</head>
<body>
  <div class="AcilirMenu">
    <span class="SabitMenu">Mouse ile Üzerine Gel</span>

    <div class="AcilirMenu-Icerik">
      <p>Merhaba Dünya!</p>
    </div>
  </div>
</body>
</html>
