<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hem Sola Hem Sağa Yaslı Menü</title>
  <style>
    .Buton {
      background-color: #4CAF50;
      color: white;
      padding: 16px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .AcilirMenu {
      position: relative;
      display: inline-block;
    }

    .AcilirMenu_Icerik {
      display: none;
      position: absolute;
      right: 0;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .AcilirMenu_Icerik a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .AcilirMenu_Icerik a:hover { background-color: #f1f1f1; }

    .AcilirMenu:hover .AcilirMenu_Icerik { display: block; }

    .AcilirMenu:hover .Buton { background-color: #3e8e41; }
  </style>
</head>
<body>
  <h2>İki Tarafa Yaslı Açılır Menü Uygulaması</h2>

  <div>
    <div class="AcilirMenu" style="float:left;">
      <button class="Buton">Sol Buton</button>
      <div class="AcilirMenu_Icerik" style="left:0;">
        <a href="#">Sol Link 1</a>
        <a href="#">Sol Link 2</a>
        <a href="#">Sol Link 3</a>
      </div>
    </div>

    <div class="AcilirMenu" style="float:right;">
      <button class="Buton">Sağ Buton</button>
      <div class="AcilirMenu_Icerik">
        <a href="#">Sağ Link 1</a>
        <a href="#">Sağ Link 2</a>
        <a href="#">Sağ Link 3</a>
      </div>
    </div>
  </div>
</body>
</html>
