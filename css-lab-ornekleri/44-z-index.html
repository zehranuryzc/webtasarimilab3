<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Örtüşen Öğeler (z-index)</title>
  <style>
    img {
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: -1;
    }
  </style>
</head>
<body>
  <h1>Burası bir başlıktır. (z-index kullanımı)</h1>
  <img src="w3css.gif" width="100" height="140" alt="örnek resim">
  <p>Resim z-index:-1 değerine sahip olduğu için metinle çakıştığında onun arka planına yerleşti. Normalde z-index kullanmasaydık resim ön planda olurdu. Metin arkada kalırdı.</p>
</body>
</html>
