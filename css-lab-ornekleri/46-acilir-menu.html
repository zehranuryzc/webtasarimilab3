<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Açılır Menü (Dropdown)</title>
  <style>
    .AcilirMenu {
      position: relative;
      display: inline-block;
    }

    .Buton {
      background-color: #4CAF50;
      color: white;
      padding: 16px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .Linkler {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .Linkler a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .Linkler a:hover { background-color: #e1e1e1; }

    .AcilirMenu:hover .Linkler { display: block; }

    .AcilirMenu:hover .Buton { background-color: #ff6a00; }
  </style>
</head>
<body>
  <h2>Açılır Menü Yapımı</h2>
  <p>Mouse ile Buton üzerine gelin</p>

  <div class="AcilirMenu">
    <button class="Buton">Buton</button>
    <div class="Linkler">
      <a href="#">Karabük</a>
      <a href="#">Bartın</a>
      <a href="#">Kastamonu</a>
    </div>
  </div>
</body>
</html>
