<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>position: static;</title>
  <style>
    div.static {
      position: static;
      border: 3px solid #73AD21;
    }
  </style>
</head>
<body>
  <h2>position: static;</h2>
  <p>Konumu statik olan bir öğe herhangi özel bir konumlandırma yapılmamış demektir. Sayfanın normal akışına göre konumlandırılır.</p>
  <div class="static">Bu div elemanın pozisyonu static; olarak ayarlanmıştır.</div>
</body>
</html>
