<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiket + Class Seçici (p.classOrtala)</title>
  <style>
    p.classOrtala { text-align: center; color: blue; }
  </style>
</head>
<body>
  <h1 class="classOrtala">Bu Başlık Sınıf Adından Etkilenmemiştir</h1>
  <p class="classOrtala">Bu yazı sadece (p)-Paragrafın Sınıfına İşaret edildiğinden etkilenmiştir</p>
</body>
</html>
