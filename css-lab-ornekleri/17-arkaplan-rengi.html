<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arka Plan Rengi (background-color)</title>
  <style>
    h2 { background-color: lightgreen; }
    div { background-color: lightblue; }
    p { background-color: yellow; }
  </style>
</head>
<body>
  <h2>Buradaki h2 başlığının arkaplan rengi "background-color: lightgreen;" ifadesi ile ayarlanmıştır</h2>

  <div>
    Bu ifade "div" öğesi içinde yazılmıştır.
    <p>Bu p paragrafı "div" öğesi içerisindedir ama kendisine ait arkaplan rengi vardır.</p>
    Bu yazı paragrafın dışındadır ama "div" öğesinin içerisindedir.
  </div>
</body>
</html>
