<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>position: relative;</title>
  <style>
    div.relative {
      position: relative;
      left: 30px;
      border: 3px solid #73AD21;
    }
  </style>
</head>
<body>
  <h2>position: relative;</h2>
  <p>relative pozisyonlama öğenin normalde görüneceği yerden ötelenmesini sağlayacaktır. Bunun çalışabilmesi için top, right, bottom, left özelliklerinin ayarlanmış olması gerekir.</p>
  <div class="relative">Bu div elemanın pozisyonu: relative;</div>
</body>
</html>
