<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anahat (Outline)</title>
  <style>
    p.Orn1 { outline: dotted red; }
    p.Orn2 { outline: thick ridge pink; }
    p.Orn3 {
      border: 1px solid black;
      outline-style: solid;
      outline-color: red;
      outline-width: thick;
    }
  </style>
</head>
<body>
  <h2>Outline (Anahat) Özelliği</h2>

  <p class="Orn1">dotted red (çizgili kırmızı) outline.</p>
  <p class="Orn2">thick ridge pink (çıkıntılı pembe) outline.</p>
  <p class="Orn3">thick (kalın) outline. Dikkat. İçinde border vardır.</p>
</body>
</html>
