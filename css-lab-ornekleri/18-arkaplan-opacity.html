<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arka Planı Şeffaf Yapma (opacity)</title>
  <style>
    div { background-color: green; }
    div.birinci { opacity: 0.1; }
    div.ikinci { opacity: 0.3; }
    div.ucuncu { opacity: 0.6; }
  </style>
</head>
<body>
  <h2>Arkaplanı Şeffaf Yapma</h2>
  <div class="birinci"><h1>opacity 0.1</h1></div>
  <div class="ikinci"><h1>opacity 0.3</h1></div>
  <div class="ucuncu"><h1>opacity 0.6</h1></div>
  <div><h1>opacity 1 (varsayılan)</h1></div>
</body>
</html>
